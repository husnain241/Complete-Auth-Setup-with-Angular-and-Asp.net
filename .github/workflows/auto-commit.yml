name: Daily Auto Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'    # 11 AM Pakistan
    - cron: '0 9 * * *'    # 2 PM Pakistan
    - cron: '0 11 * * *'   # 4 PM Pakistan

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Random Commit
        run: |
          git config user.email "alihusnaintcf970@gmail.com"
          git config user.name "husnain241"

          DAY=$(date '+%A')
          if [ "$DAY" = "Friday" ]; then
            echo "Friday - skipping commits"
            exit 0
          fi

          HOUR=$(date -u '+%H')

          # 4 PM (last run) sirf 50% chance pe commit karega -> total 2 ya 3
          if [ "$HOUR" = "11" ]; then
            if [ $((RANDOM % 2)) -eq 0 ]; then
              echo "Skipping this run (randomly)"
              exit 0
            fi
          fi

          MESSAGES=(
            "feat: improve UI components"
            "fix: resolve minor bugs"
            "refactor: clean up code structure"
            "docs: update documentation"
            "chore: optimize performance"
            "style: format code"
            "test: add unit tests"
            "perf: improve load time"
          )

          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          echo "- $(date '+%Y-%m-%d %H:%M:%S') — $MSG" >> log.md
          git add .
          git commit -m "$MSG"
          git push
