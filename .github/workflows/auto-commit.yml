name: Daily Auto Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'    # 9 AM Pakistan
    - cron: '0 6 * * *'    # 11 AM Pakistan
    - cron: '0 8 * * *'    # 1 PM Pakistan
    - cron: '0 9 * * *'    # 2 PM Pakistan
    - cron: '0 11 * * *'   # 4 PM Pakistan

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Random Commits (3-10 per day total)
        run: |
          git config user.email "alihusnaintcf970@gmail.com"
          git config user.name "husnain241"

          DAY_NAME=$(date -u '+%A')
          if [ "$DAY_NAME" = "Friday" ]; then
            echo "Friday - skipping commits"
            exit 0
          fi

          HOUR=$(date -u '+%H')
          TODAY=$(date -u '+%Y-%m-%d')
          STATE_FILE=".commit_state"
          HOURS=(04 06 08 09 11)

          # State read/init
          if [ -f "$STATE_FILE" ]; then
            read STATE_DATE STATE_TOTAL STATE_DONE < "$STATE_FILE"
          else
            STATE_DATE=""
          fi

          if [ "$STATE_DATE" != "$TODAY" ]; then
            STATE_TOTAL=$(( (RANDOM % 8) + 3 ))   # 3 se 10 tak
            STATE_DONE=0
            STATE_DATE=$TODAY
            echo "New day target: $STATE_TOTAL commits"
          fi

          # Kitni runs is waqt ke baad (is run samet) baqi hain
          REMAINING_RUNS=0
          FOUND=0
          for h in "${HOURS[@]}"; do
            if [ "$h" = "$HOUR" ]; then FOUND=1; fi
            if [ "$FOUND" = "1" ]; then REMAINING_RUNS=$((REMAINING_RUNS+1)); fi
          done
          if [ "$REMAINING_RUNS" = "0" ]; then REMAINING_RUNS=1; fi

          REMAINING_COMMITS=$((STATE_TOTAL - STATE_DONE))

          if [ "$REMAINING_COMMITS" -le 0 ]; then
            echo "Aaj ka target pura ho chuka hai, kuch nahi karna"
            exit 0
          fi

          if [ "$REMAINING_RUNS" -le 1 ]; then
            THIS_RUN=$REMAINING_COMMITS
          else
            MAX_THIS=$((REMAINING_COMMITS - (REMAINING_RUNS - 1)))
            if [ "$MAX_THIS" -lt 1 ]; then MAX_THIS=1; fi
            THIS_RUN=$(( (RANDOM % MAX_THIS) + 1 ))
          fi

          echo "Is run mein $THIS_RUN commits (target: $STATE_TOTAL, done so far: $STATE_DONE)"

          MESSAGES=(
            "feat: improve UI components"
            "fix: resolve minor bugs"
            "refactor: clean up code structure"
            "docs: update documentation"
            "chore: optimize performance"
            "style: format code"
            "test: add unit tests"
            "perf: improve load time"
            "chore: daily maintenance"
            "fix: edge case handling"
          )

          for i in $(seq 1 $THIS_RUN); do
            MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
            echo "- $(date '+%Y-%m-%d %H:%M:%S') — $MSG" >> log.md
            git add .
            git commit -m "$MSG"
            sleep $(( (RANDOM % 20) + 5 ))
          done

          STATE_DONE=$((STATE_DONE + THIS_RUN))
          echo "$STATE_DATE $STATE_TOTAL $STATE_DONE" > "$STATE_FILE"
          git add "$STATE_FILE"
          git commit -m "chore: update commit state" --allow-empty
          git push
