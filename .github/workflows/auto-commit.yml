name: Daily Auto Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'   # 2 PM Pakistan

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Daily Commits (per weekday count)
        run: |
          git config user.email "alihusnaintcf970@gmail.com"
          git config user.name "husnain241"

          DAY=$(date '+%A')

          case "$DAY" in
            Monday)    COUNT=2 ;;
            Tuesday)   COUNT=4 ;;
            Wednesday) COUNT=5 ;;
            Thursday)  COUNT=3 ;;
            Friday)    COUNT=0 ;;
            Saturday)  COUNT=6 ;;
            Sunday)    COUNT=1 ;;
          esac

          echo "$DAY -> $COUNT commits"

          if [ "$COUNT" = "0" ]; then
            echo "No commits today"
            exit 0
          fi

          MESSAGES=(
            "feat: improve UI components"
            "fix: resolve minor bugs"
            "refactor: clean up code structure"
            "docs: update documentation"
            "chore: optimize performance"
            "style: format code"
            "test: add unit tests"
            "perf: improve load time"
          )

          for i in $(seq 1 $COUNT); do
            MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
            echo "- $(date '+%Y-%m-%d %H:%M:%S') — $MSG" >> log.md
            git add .
            git commit -m "$MSG"
          done

          git push
