name: Daily Auto Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'    # 11 AM Pakistan
    - cron: '0 9 * * *'    # 2 PM Pakistan
    - cron: '0 11 * * *'   # 4 PM Pakistan

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Random Commits
        run: |
          git config user.email "alihusnaintcf970@gmail.com"
          git config user.name "husnain241"

          DAY=$(date '+%A')
          if [ "$DAY" = "Friday" ]; then
            echo "Friday - skipping commits"
            exit 0
          fi

          MESSAGES=(
            "feat: improve UI components"
            "fix: resolve minor bugs"
            "refactor: clean up code structure"
            "docs: update documentation"
            "chore: optimize performance"
            "style: format code"
            "test: add unit tests"
            "perf: improve load time"
            "chore: daily maintenance"
            "fix: edge case handling"
          )

          COUNT=$(( (RANDOM % 8) + 1 ))
          echo "Making $COUNT commits this run"

          for i in $(seq 1 $COUNT); do
            MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
            echo "- $(date '+%Y-%m-%d %H:%M:%S') — $MSG" >> log.md
            git add .
            git commit -m "$MSG"
            sleep $(( (RANDOM % 20) + 5 ))
          done

          git push
